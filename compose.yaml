services:
  app:
    build: .
    ports:
      - "8081:8081"
    volumes:
      - ./src:/app/src  # Sync source code into container
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pom.xml
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: portfoliodb
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"

  mongodb:
    image: mirror.gcr.io/library/mongo:7
    ports:
      - "27017:27017"
