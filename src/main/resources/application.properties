spring.application.name=technical-portfolio
spring.datasource.url=jdbc:h2:mem:portfoliodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Base H2 (embarquée, toujours disponible, zéro dépendance externe) ---
app.datasource.h2.url=jdbc:h2:mem:portfoliodb
app.datasource.h2.driver-class-name=org.h2.Driver
app.datasource.h2.username=sa
app.datasource.h2.password=

# --- Base PostgreSQL (via le conteneur Docker défini dans compose.yaml) ---
app.datasource.postgres.url=jdbc:postgresql://localhost:5432/portfoliodb
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.username=portfolio
app.datasource.postgres.password=portfolio

# Base active au démarrage de l'application ("h2" ou "postgres")
app.datasource.default=postgres

# Note : on utilise volontairement des clés "app.datasource.*" (pas "spring.datasource.*")
# pour empêcher Spring Boot de créer automatiquement SA propre DataSource — on construit
# les deux DataSource nous-mêmes dans DataSourceConfig.java, et on les expose comme un
# DataSource unique routé (RoutingDataSource), désigné @Primary pour que JPA l'utilise.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console