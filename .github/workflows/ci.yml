name: CI/CD Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: technicalportfolio
  GCP_REGION: europe-west1
  ARTIFACT_REPO: technical-portfolio-repo
  IMAGE_NAME: backend

jobs:
  test:
    name: Compiler et lancer les tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Lancer les tests
        run: ./mvnw -B test

  deploy:
    name: Build + Push + Déploiement Cloud Run
    runs-on: ubuntu-latest
    needs: test
    # Sécurité : on ne déploie JAMAIS depuis une pull request, seulement depuis
    # un vrai push sur main — sinon n'importe quelle PR pourrait redéployer en prod.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Construire l'image Docker (Cloud Native Buildpacks)
        run: ./mvnw -B spring-boot:build-image -DskipTests

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Installer le CLI gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Taguer l'image pour Artifact Registry
        run: |
          docker tag technical-portfolio:latest \
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Pousser l'image vers Artifact Registry
        run: |
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Déployer sur Cloud Run
        run: |
          gcloud run deploy technical-portfolio \
            --image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.IMAGE_NAME }}:latest \
            --region=${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port=8080