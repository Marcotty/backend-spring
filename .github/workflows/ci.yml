name: CI Backend

# Se déclenche à chaque push et à chaque pull request ciblant main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Compiler et lancer les tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'   # met en cache ~/.m2 entre les runs : builds bien plus rapides

      - name: Lancer les tests (ProjetServiceTest, ProjetRestControllerTest...)
        run: ./mvnw -B test
        # -B = mode "batch" (pas de sortie interactive), standard pour un environnement CI

  build-image:
    name: Construire l'image Docker
    runs-on: ubuntu-latest
    needs: test   # ne se lance QUE si le job "test" a réussi — c'est le vrai intérêt du CI/CD

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construire l'image avec les Cloud Native Buildpacks
        run: ./mvnw -B spring-boot:build-image -DskipTests
        # -DskipTests : les tests ont déjà tourné dans le job précédent, pas besoin de les relancer ici